front:
  text: 序竊思人之所以病者天地之氣化也病之所以死所以生者人身之氣化也夫熱則氣泄寒則氣收怒則氣上恐則氣下喜則氣緩悲則氣消勞則氣耗驚則氣亂思則氣結病隨氣行雖千變萬化要不外乎由表入里則死由里出表則生爾今醫士皆能治病而死生莫決何也蓋西醫尚實驗專事剖解以求病而病源不見何以決死生中醫尚氣化但言天地之氣化即理想難憑何以決死生夫病有不待剖解而知者有剖視不得見而求之人身氣化中有實驗者如太陽氣化為寒水其症有惡風惡寒少陽氣化為相火其症有口苦目眩此皆人身之氣化剖視不得見而其症固實有可驗不待剖解而知也我國醫聖張仲景因漢時醫家不於人身氣化中求病源其宗族多被醫誤故作傷寒雜病論發明人身氣化之理以惠後學不料後學但知天地之氣化而不知人身之氣化誤加註釋相沿至今將二千年不知誤人多少致令醫界中人談及傷寒皆瞠目相視噤口不言此家君所以改良古注闡發病源而作是書也書既成家君因命余讎校更正先付排印以質當世之知醫者是為序沈懋官肖卿氏序於京都延壽寺街醫寓自序嘗閱溫病條辨與溫熱經緯而知軒岐長沙之書無人研究何也熙熙攘攘名利是求其所以率爾操觚者皆名利之心迫而出之其於古聖心傳固漠然無所動於中不求經旨妄加註釋晉叔和唐王冰誤解於前各家誤解於後一誤再誤致令神聖相傳之醫學淹沒將二千年迄未發明而吳鞠通王孟英輩復欲撇去傷寒獨開生面而不自知其愚昧集葉氏指南數方以行於世可為葉氏功臣其實則仲景之罪人也仲景論桂枝湯為太陽中風之主方太陽病脈浮者為風寒在表尚宜此湯並未言溫病宜桂枝湯主之而鞠通論溫病開首即以此方誣聖其不明經旨可知矣仲景論傷寒霍亂宜五苓四逆理中等方而鞠通誤解以治溫病霍亂以熱治溫其不殺人也幾希仲景論少陰病寒傷少陰也而孟英以少陰病為溫病竊附於仲景門牆以誤後學此胡為者噫自晉迄今以藥試病於試驗中幸得數方即稱名醫知其然而不知其所以然病理不明死生莫決此中國醫學所以日趨於腐敗也近時英俊又復喜新厭故競尚西學不知西人之性質西方之風土與中國大不相同其人性情強皮膚密毫毛堅其病生於內故西醫論病皆曰肺炎肝炎腸胃炎治法皆宜內攻也華人性情柔皮膚疏毫毛軟其病生於外故中醫論病皆曰風寒暑濕燥火治法當從外解也習慣不同病情不同治法是以不同人身一氣機耳熱則氣泄寒則氣收收則病入泄則病出氣存則生氣絕則死病雖千變氣化則一此我國醫聖所以作傷寒雜病論也西醫不言氣化專事實驗輒遇瘟疫即倉惶失措中醫但言天地之氣化而不求人身之氣化是以注傷寒家皆曰少陰之上熱氣治之陽明之上燥氣治之此非天地氣化乎天地之少陰為君火人身之少陰為腎水天地之陽明燥金為寒燥人身之陽明燥土為火燥仲景論人身注家說天地此醫聖經旨所以迄未發明也麟不敏不能將各國醫學廉收並蓄竊願發明經旨俾後學見病知源詳釋經文分別溫熱辨西方瘟疫之名集平時經驗之方不揣固陋類聚成篇尚祈中西同志繩愆糾謬發明人身氣化之病理庶使古聖心傳大放光明於世界江蘇沈麟漢卿氏作於天津合濟醫院
