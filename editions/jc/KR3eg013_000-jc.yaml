錢半殭蠶二錢薄荷一錢瘟疫時行頭暈目赤衄血吐血胯腋之間起核者鼠疫也東醫名腺百斯篤鼠疫方主之地氣上騰鼠先受病故名鼠疫鼠疫方連翹三錢柴胡二錢葛根二錢生地五錢當歸錢半桃仁八錢去皮尖杵赤芍三錢紅花五錢甘草二錢川樸一錢避疫丸赤小豆鬼箭羽鬼臼雄黃上四味等分研細篩蜜丸如小豆大瓷瓶收貯每服一丸可與病人同床不致傳染治驗直隸樂亭劉復青之母久患咳嗽以千金延予往診予視其咳吐膿血不得臥右寸數大予曰此肺癰也予擬犀黃湯服後膿血漸止隨症加減十餘劑飲食漸進夜已安臥惟咳嗽未除予即返津因作咳嗽治法於下咳嗽有五邪五邪者寒熱燥濕風是也寒咳嗽者冬令傷寒寒邪入肺咳而喘麻黃湯主之熱咳嗽者面色赤咳嗆氣逆瀉白散主之燥咳嗽者咳吐白沫清燥湯主之濕咳嗽者痰飲內聚有寒有熱寒飲咳者二陳湯主之熱食咳者杏仁石膏防己湯主之風咳嗽者喉中癢咳吐黃痰桑杏湯主之咳嗽分四時春咳嗽者風氣通肝人氣上升法當清解加減桑菊飲主之夏咳嗽者火氣炎上人氣外泄法當苦降杏樸芩連湯主之秋咳嗽者人氣內收清氣入肺法當疏解杏蘇散主之冬咳嗽者人氣內藏寒邪入肺法當溫散麻黃湯主之外邪已解五更咳嗽者胃中有積食宜消食降火曲麥山楂地骨知母湯主之外邪已解黃昏咳嗽者火氣入肺也不宜涼藥當斂而降之二五飲主之午前咳嗽者胃中有火宜石膏二母湯午後咳嗽者屬陰虛宜知柏四物湯咳嗽氣逆連咳十餘聲咳至不能轉吸者名頓嗆二冬膏主之咳而喘不得臥喉中有水雞聲射干麻黃湯主之胸痹者加栝蔞喘家咳作定喘湯主之外感風寒內有寒飲喘咳者小青龍湯主之肺虛咳嗽者阿膠甘草梨膏湯主之肺冷咳嗽者乾薑五味甘草湯主之咳嗽吐血者咳血方主之久咳面浮肢腫者熱飲外溢也桑皮杏仁飲主之犀角湯方犀黃一分沖青黛五分前胡錢半杏泥錢半甘草一錢竹瀝水三錢沖蔞皮錢半桔梗一錢川貝母三錢二陳湯方半夏三錢陳皮錢半茯苓三錢甘草一錢杏仁石膏防己湯方杏仁二錢石膏三錢木防己一錢雲苓三錢加減桑菊飲方桑葉錢半前胡錢半甘草一錢川貝母二錢杏泥三錢款冬錢半菊花錢半陳皮一錢紫苑八分焦枳殼六分竹茹二錢杏樸芩連湯方杏泥三錢川貝三錢川樸一錢栝蔞錢半黃芩一錢梨汁一杯川連一錢冰糖二錢曲麥山楂地骨知母湯方神麯二錢山楂二錢麥芽三錢知母三錢地骨皮三錢二五飲方五味子三十粒五倍子一錢石膏二母湯方石膏三錢川貝二錢知母二錢甘草一錢知柏四物湯方知母二錢黃柏錢半當歸一錢川芎六分白芍二錢乾地黃三錢二冬膏方天門冬麥門冬二味熬膏每服一兩射干麻黃湯方射干一錢半夏三錢生薑三片紫苑八分款冬錢半五味子十粒麻黃八分細辛一分大棗四枚定喘湯方白果三錢款冬錢半甘草一錢黃芩八分杏泥三錢桑白皮一錢麻黃一錢蘇子七分半夏三錢小青龍湯方桂枝錢半乾薑錢半甘草錢半細辛五分半夏三錢五味子百粒麻黃錢半白芍錢半阿膠甘草梨膏湯方阿膠三錢甘草三錢炙梨膏五錢沖乾薑五味甘草湯方乾薑八分炙草二錢五味子三十粒桑皮杏仁飲方桑皮一錢杏泥三錢五茄皮一錢車前子一錢大腹皮一錢陳皮一錢茯苓皮錢半地骨皮錢半山東舊軍孟養軒之子患痢以千金延予往診予視其痢色忽黃忽綠忽黑日夜十餘次余曰此五色痢也為擬扶土瀉木湯合銀楂湯加減十餘劑痢始愈飲食漸進惟痢後脾虛大便尚溏適予患泄瀉不能久留為定上方返津因作痢疾治法於下痢有五色各有病源當分治之痢色赤或先白後赤或赤多白少者熱痢也經云腸中熱便腸垢即此症也銀楂芩連湯主之痢色黃者協熱痢也經云出黃如糜即此症也葛根黃芩黃連湯主之痢色綠者膽汁入胃木火乘土治當扶土抑木陳苓朮芍甘連湯主之痢色純白者寒濕下痢也姜苓朮草湯主之理中湯亦主之脈沉遲者加附子痢色純黑如漆者下瘀血也銀楂薑桂大黃湯主之所謂痢者滯下膠黏似痰非痰裡急後重日數十次者是也若下鮮血者為腸風下血非痢也槐花散主之噤口痢飲食即吐不食亦嘔者膽火上乘也銀楂芩連湯主之虛者胃中冷腸中熱不治下痢身無熱而脈數者熱在經中須針刺之腰腿痠痛者刺委中出血下血後重者氣虛也獨參湯主之黃耆阿膠湯亦主之扶土瀉木合銀楂湯方川連錢半銀花炭二錢赤砂糖錢半陳皮八分竹茹錢半甘草八分南楂炭二錢焦建曲錢半茯苓錢半枳實五分銀楂芩連湯方銀花炭南楂炭各三錢青蒿川連酒芩赤砂糖各錢半陳苓朮芍甘連湯方陳皮一錢茯苓二錢白朮八分白芍八分甘草一錢川連一錢姜苓朮草湯方生薑三錢茯苓三錢白朮二錢甘草八分理中湯方人參三錢甘草一錢白朮錢半乾薑五分銀楂薑桂大黃湯方銀花炭南楂炭赤砂糖各三錢大黃一錢肉桂炮姜各二分獨參湯方人參三錢黃耆阿膠湯方黃耆六錢阿膠三錢炙甘草一錢黨參五錢陳皮一錢黎黃陂因琴師患風濕病公府醫官治之無效邀予往診予診其脈浮而數身痛予曰此風濕已化熱也隨帶小兒少卿為擬祛風利濕清熱之品數劑而愈其夫人危氏有肝氣病久未生育因帶診予診其尺部略澀知胞中有瘀宜梅花結子丹因初診未立丸方為擬調氣和肝之品嗣後危夫人親至敝寓適予出診未遇由小兒代開丸方未用梅花因作肝氣論治法於下肝氣病者人之本氣病也有因怒傷肝者名怒狂有血熱肝旺者有脾寒肝旺者名肝火有因抑鬱思慮傷肝及脾者名肝鬱有因風邪入里內動肝火者名肝風有血虛不足以養肝致動肝風者為虛風有痰多氣滯肝氣不得疏泄者為痰火大怒傷肝血隨氣升血菀於上則發狂內經用鐵落飲不愈宜遂心丹血熱肝旺者宜溫膽湯加左金丸婦人宜三黃四物湯脾寒肝旺者宜香附烏藥散抑鬱思虛傷肝及脾者宜舒氣扶脾丸風邪動肝宜桑菊飲血虛不足養肝致動肝風者洋參竹茹湯主之阿膠鱉甲湯亦主之痰多肝旺者清氣化痰湯主之肝氣傷衛上為噎膈下為失氣噎膈者代赭旋覆湯主之肝氣傷營上為蓄血下為經閉蓄血病癲者失笑散主之經閉腹痛者枳實芍藥散主之鐵落飲方鐵落四兩即打鐵時落下之碎鐵水煎服遂心丹方甘遂一錢研辰砂一錢豬心管內血三條上方取豬心管血三條和甘遂末一錢將豬心批作二邊內甘遂末用線縛好外用皮紙裹慢火煨熟不可焦取末細研入硃砂一錢和勻分作四丸每服一丸將豬心煎湯化下大便下惡物為度溫膽湯加左金丸方焦枳實八分姜竹茹三錢左金丸八分茯苓錢半姜半夏錢半陳皮錢半甘草八分三黃四物湯方酒芩五分川連五分川芎五分當歸一錢白芍一錢生地二錢黃柏五分香附烏藥散方制香附錢半綠萼梅八分陳皮八分青皮五分烏藥八分左金丸一錢焦枳實七分甘草八分白芍一錢舒氣扶脾丸方綠萼梅八分代代花一錢薄荷八分雲苓一錢焦枳實五分制香附錢半甘草八分青皮五分炒麥芽錢半姜半夏一錢廣皮一錢白芍錢半山藥一錢洋參竹茹湯方西洋參一錢竹茹三錢阿膠鱉甲湯方生鱉甲五錢阿膠一錢白芍一錢炙草一錢小草八分淡菜二枚西洋參一錢清氣化痰湯方制膽星八分焦枳實七分栝蔞霜錢半酒芩一錢茯苓二錢法半夏錢半焦建曲錢半廣皮一錢粉甘草八分代赭旋覆湯方代赭石一錢黨參一錢炙草八分半夏二錢旋覆花錢半包大棗二枚生薑二片失笑散方五靈脂蒲黃各八分枳實芍藥散方焦枳實一錢半白芍三錢李伯芝之母患筋痹身痛西醫治之無效疼痛加劇側臥不能動延予往予以羚羊角散一服而愈劉履貞之侄患肝氣乘脾脅痛便溏西醫治之無效延予往予為擬抑木扶土湯連服四劑即愈穆文藻患頭目疼痛入醫院包治西醫以冰冰之頭痛益劇口吐白沫手足冷過肘膝於是抬回穆莊延予往診當時中醫往診者皆曰此真頭痛不治之症也予察其脈遲細痛在腦後即以頭風摩散摩腦後痛稍減後服麻黃附子細辛湯頭痛即止楊少農之如夫人患噤口痢中西醫均言不治延予往診問予曰此病能愈乎予應之曰能又問曰幾服能愈予應之曰三四服後果然恆利公司孫君之子患喉痧身發赤斑狂叫不已西醫以藥水洗喉無效急延予往予為擬玉女煎一服而愈張戟門之廚司患落頭疽紅腫高大連及兩耳西醫包治不保險求治於予予令外科學生高佩華用自制升丹藥線逐日更換為擬神授衛生湯一月而愈候知事患發背大如盤徑四寸余如蜂窩狀西醫敷之以西藥疼痛異常求予診治予令外科學生用自制五色靈丹為擬透膿散三黃湯輪服月餘而愈以上諸症並無疑難予皆應手取效何西醫治之皆無效此非西醫無能蓋其所學者宜西人不宜治華人也因作中西病源不同論於下西人以遊牧立國其人多肉食肉性溫而味厚其溫度外達肌膚故西人常以冷水浴身風寒不能傷其外其病生於內華人以農業開基民多穀食穀食清而味薄其溫度不及肌膚外不足以御風寒其病生於外西人以冷水浴身其寒氣入絡則身痛西醫塗之以碘酒服之以阿斯匹林其痛自愈華人外感風邪風熱傷筋故身痛塗之以碘酒則以熱治熱此李太夫人之病所以治之加劇也西人肝病病生於內平肝氣瀉肝火其病即愈而劉履貞之侄外感風寒肝寒乘脾故脅痛便溏法當疏解西醫不知其病自外來是以無效西人頭痛病生於內肝火上衛也以冰冰之則火氣自退穆文藻之頭痛病生於外以冰冰之則寒邪入腦是以益劇西人患痢病生於內酒肉積滯瓜果內停所致也以硝水洗腸以萆麻下滯固宜華人之痢病生於外夏令受暑暑熱入腸而後下痢法當清暑西醫不知其病之由來是以無效喉痧由於風熱入絡病生於外痧解則喉痛自愈其病不在喉西醫以為喉頭炎是以洗之無效落頭疽發背等症雖屬外科而病根皆生於里西醫治外不治內是以不敢保險也此豈西醫無能哉蓋中西人之性質不同習慣不同病源不同醫學所以不同我國英俊幸勿競尚西醫自戕性命使五千年神聖相傳之學棄之如遺豈不惜哉常州劉麗亭患真中風口眼歪斜手足拘攣舌強不能言余用再造丸其始在友人處覓得一丸服之無效後由京都寄來一丸腦丸中有牛角盒一個服之立愈蓋再造丸方有真有偽故有效有不效也醫家陳一生患虛勞滑精其精常自出臥不能起余用黃耆建中湯十餘劑始愈江沈秀高患臌脹腹大如箕腹上現青筋兩條飲食不進每日勉強吃稀粥飲一小杯自覺脹滿異常余擬用雞矢體因思無制體之法即用雞內金一百枚焙研細末每服一錢燒酒調下日三服初服一日即進飲食二日腹脹減連服數日藥未完而病已愈矣天津錢氏婦患噎膈反胃粒米不下日服稀粥飲服至一杯必須嘔吐不吐則心中難受必以手探之吐而後已復服復吐如是者已經月餘余曰此胃中有瘀為擬韭汁牛乳飲服一劑不吐連服七劑愈李晦庵之如夫人患經漏不止袁項城派公府醫官並惠送醫藥服之無效延予往診予曰此氣不攝血也須用吉林老山人參每服一錢開水燉須三小時一劑知二劑已阮鬥瞻之弟婦產後腹痛發熱飲食不進由京中派醫官二人來津其始用失笑散不效腹益痛繼用當歸羊肉湯不效身熱尤甚延予往診予曰此外感風邪也為擬柴胡飲子其醫官議予方曰此方服下當即汗脫病家持方問予予曰倘服此方汗脫予當負責若不汗脫當云何病家謂予曰君有把握病能愈乎予應之曰果服予方一劑病當十去其九次日延予復診予問曰今日病情何如彼應曰不但九成竟悉愈矣予曰二位醫官能否請見據云已於清晨入都矣李嘯溪患黃癉寒熱往來予用小柴胡湯服後寒熱已解其腹滿改用茵陳蒿湯服後小便下如黑醋色病略減後用豬膏發煎愈其兒婦產後身熱不欲飲食予診其右關沉滑余曰此食積也彼曰誠然產後自吃雞子二枚始得病予為擬生化湯內加醋一小杯沖服次日即愈陸鳳石之寄孫劉氏子患腹中痞疾漸成水脹大小腹俱腫連及兩腿腎囊腫大如水晶球形龜頭腫彎如鉤予初用越婢湯黃耆防己湯病漸減後用商陸末入麝香少許醋調敷臍上小便利囊腫即消為擬消痞方數服而愈張懷斌之女心中煩擾坐臥不寧予診其脈浮為擬梔子豉湯一劑即愈王某咳嗽日久不愈咳吐白沫予診其脈一息九至問其胃口尚能飲食予曰此肺痿也為擬清燥救肺湯十餘劑始愈寧波余某之妻患血奔不止津醫林子皋用老山人參服後神志欲狂延予往診予曰此熱血上衝心也令其先服童便為擬三黃調經湯數劑始愈其夫因人參尚未服完棄之可惜即自服之服後心神不定身即汗出林子皋為擬一方用石膏二兩心神益亂日夜在家中環走不休家人均以為顛予診其脈浮為擬梔子豉湯加萊菔子一服而愈常州醫家劉雨人患秋溫醫官李仁甫用香砂六君子湯服後大汗出不止胸悶不堪延予在診予診其脈浮濡曰此伏暑也為擬清暑飲一劑知二劑已醫家孫薏蓀患溫疹唐靜炎為擬大承氣湯服後下黑糞身熱神昏延予往診予診其脈沉曰邪已入里不治令其請唐先生次日死其後唐君亦病延予往診予視其年逾七旬精神倦怠謂予曰求先生救命予診其脈微數視其前方用大承氣湯予曰先生年高氣虛何以用大承氣湯先生善治溫病蓋善用此方但先生未病溫而用此方何也彼曰予胸膈痞悶是以用之予曰君休矣氣虛中滿而用大承氣湯下傷陽氣予實無法治另請高明可也越三日而卒醫家劉小坡患痢延予往診予視其大便多糞與血問其裡急後重否彼曰諸症悉愈惟下痢日五六次耳予令購神妙奇效丹此藥由天津京報房出售當即購服一包次日愈王某患楊梅毒痢月餘不能起床奄奄一息余擬用九龍丹服後痢即止調養月餘而愈張氏婦患小產後肝厥不省人事予診其手熱脈厥予曰此肝虛熱厥也為擬三甲復脈湯一服即愈又李氏婦患胎厥予擬羚羊角散一服愈又錢氏婦患虛厥予擬洋參竹茹湯服後漸愈李十七之子患驚風下五色痢予擬銀楂加羚羊竹茹湯服一劑驚風愈而痢不止後用銀楂湯十餘劑而愈鄭墨林年八十餘患喘咳予擬麻黃石膏杏仁乾薑湯不敢頓服先試服一匙喘稍減後服半劑頗效遂服調理兩日即愈萬蔭南年五十餘無子求治於予予為擬七寶美髯丹服一料後即生子寧波張麟生之歸患小產連產四次變成滑胎其母本日本人寓長崎延醫診治均無效來津就醫予診其左尺搏指予曰胎已兩月矣為制保胎丸令其於下月服三服米飲送下胎未滑後即生子此方藥味予已妄記幸當時所制丸藥尚留有數十服可以備用孫多禔患瘧因有要差急欲出門予令其於瘧發前半時許以繩束十指間刺其絡出紫血如綠豆大即愈宜子望患溺血予始擬小薊飲子後用知柏地黃湯病愈後予囑其勿食牛羊雞肉閱半年適清太后召入宮聽戲賜以羊肉湯麵不敢不食食後病大作御醫治之無效後延予往已無治法予即告辭馬氏婦患喉癰湯藥不得進余以針刺之即愈郭僧忻之女患天花白陷花頂已陷面色灰白口流白沫氣喘欲絕余擬參茸姜附桂歸湯已不能進勉強用筆管灌入一杯次日花發如黃豆漸次調理而愈其侄女患花後失音余擬用甘桔湯兩劑愈山東張笏臣患酒咳吐血延予往診余囑其戒酒為擬葛花芩連湯數劑而愈史氏歸患腹痛手足厥冷予診其脈沉為擬桂附八味湯一服而愈上海陳以垣患子午瘧久治不愈年逾花甲骨瘦如柴延予往診余始擬常山飲服後吐黃痰碗許病勢大減後用六君加歸芍坎炁末等始愈陸春江患秋溫結胸醫家均以為不治延予往余視其身熱汗出不得臥神志昏迷予曰身汗出里無水氣不當結胸為擬小陷胸湯三服而愈張參謀患羊毛痧神昏譫語耳聾直視不能言為擬消風透痧湯外用蕎麥麵紹酒調如雞子大搓胸前並耳前後搓出羊毛無數十餘日痧始透仍不能言後用鵝翎蘸皂角末少許探入喉中吐出膠痰聲音始出葉某患戒菸下痢余初用銀楂湯加菸灰少許後用柿餅炭一枚入前數劑而愈因作鴉片論於下鴉片者洋藥中之麻醉品也其味苦其臭焦其氣能通五臟為五臟七情內傷之妙藥如肝氣鬱悶氣滯胸中痛胃脘痛脾虛下痢腹中痛吸之立愈惟夏秋霍亂及之則病加重肝火旺者不能吸吸之即頭眩何也蓋霍亂為病由於外感暑熱復感風寒而後病作其邪氣由表入里吸菸氣以通五臟則邪氣深入開門揖資是以病加重也肝火旺者吸之則肝火上升是以頭眩也鴉片有麻醉性其氣燥消鑠津液吸之日久則其氣留於五臟津液中為癮至其時則發癮發則麻醉性作作則涕唾多而嚏欠寒熱如瘧營衛不行五臟不通弱者即死強者難受不堪此吸菸者所以欲戒不能也惟柿餅能解鴉片之麻醉性但鴉片因吸入肺柿餅只能入胃不能入肺其性寒忌蟹脾寒者不能食食之則腹痛惟胃火旺大便燥結者宜之戒菸之法當先以丸藥代煙其丸藥當用米粉白糖加入菸灰蜜丸按時隨癮之大小服之至兩日後則五臟中之癮當從涕唾與汗氣排泄而出但胃中有煙癮再以柿餅代丸藥每日一次漸加至兩三次迨至不服丸藥數十日即完好如初若能將柿餅釀成美酒用以戒菸真妙品也尚祈有志之士公同研究以救世界之因病而受鴉片之害者豈不善哉再造丸方真蘄蛇去皮骨頭尾各三寸酒浸炙取淨末四兩兩頭尖系草藥出烏魯木齊非鼠糞也如不得以白附子代之制用二兩山羊血五錢虎脛骨一對醋炙龜板醋炒一兩烏藥一兩當門子五錢天竺黃一兩黃耆二兩炙沒藥一兩去油制乳香一兩北細辛一兩麻黃二兩赤芍一兩炙甘草二兩小青皮一兩羌活一兩白芷二兩大熟地二兩明天麻二兩血竭八錢另研防風二兩制附片一兩骨碎補去皮一兩犀角八錢元參酒炒二兩沉水香一兩制首烏二兩葛根二兩半藿香二兩白殭蠶一兩西牛黃二錢半川連二兩川芎二兩穿山甲二兩前後四足各用五錢麻油浸辰砂一兩飛桂心二兩川萆薢二兩炒於朮一兩地龍五錢去土紅曲八錢廣三七一兩母丁香去油一兩制香附一兩全蠍去毒二兩半全當歸二兩威靈仙二兩半川大黃二兩片薑黃二兩白茯苓二兩梅冰片二錢半桑寄生一兩半草蔻仁二兩白蔻仁二兩制松香水煮七次五錢上藥共研細末擇吉虔修煉蜜和合搗數千下為丸每丸重一錢金箔為衣外用蠟丸包裹此丸有起死回生之功故曰再造專治真中風寒痰迷厥氣半身不遂口眼喎斜腰腿疼痛手足麻木筋骨拘攣步履艱難一切風痰等症並皆治之病逾百日者難痊病後針灸漏氣者難痊年逾花甲者難痊年逾古稀者不治凡遇此症旁人切勿驚惶先向藥店購開關散少許或購靈寶如意丹七八粒研末吹入鼻中得嚏者輕不得嚏者重倘牙關緊閉用烏梅兩個分開塞左右兩腮擦之自開不可用銅鐵器撬開恐傷牙並恐驚其心凡服是丸後神氣清爽漸思飲食間有一二處屈伸不利此係熱痰留於關節用豨薟草二錢歸身白芥子各一錢紅花八分煎湯以新白布蘸熱湯擦摸一日二三次即能運動如常矣韭汁牛乳飲方韭菜汁一小杯鮮牛乳六兩藕汁一杯薑汁十滴梨汁一杯萊菔汁一杯柴胡飲子方北柴胡錢半杭芍二錢當歸二錢酒芩八分黑荊芥六分防風八分炙草一錢生化湯加醋方當歸三錢川芎錢半紅花三分炮薑炭三分炙甘草八分雞內金一錢焙研末加醋一匙煎服越婢湯方麻黃一錢石膏三錢甘草一錢生薑二片大棗四枚黃耆防己湯防己一錢黃耆錢半甘草八分白朮七分消痞湯方炒枳實一錢雞內金錢半川樸一錢茯苓三錢炒麥芽三錢半夏曲二錢川連八分川樸一錢茯苓三錢炒麥芽三錢半夏曲二錢川連八分甘草八分於朮八分黨參一錢三黃調經湯方川連一錢黃柏一錢真阿膠二錢炒續斷二錢酒芩一錢炙草一錢炒白芍二錢九龍丹方兒茶血竭木香制乳香制沒藥各一錢巴豆二分去油共研末水丸桐子大每服二丸漸加羚羊角散方羚羊片一錢杏泥三錢防風八分川芎六分炙甘草一錢薏仁三錢獨活六分當歸一錢茯神三錢竹茹三錢參茸姜附歸桂湯方人參一錢炮姜五分附子一錢黃耆三錢熟地砂仁拌三錢鹿茸五分肉桂五分當歸二錢炙草一錢七寶美髯丹方何首烏二斤赤白各半去皮切黑豆拌九蒸九曬白茯苓半斤人乳拌當歸半斤酒洗懷牛膝半斤酒浸同首烏第七次蒸至第九次菟絲子半斤酒浸蒸枸杞子半斤酒浸破故紙四兩黑芝麻拌炒上為末蜜丸桐大子用淡鹽湯或溫酒送下忌鐵器麻黃石膏杏仁乾薑湯方麻黃六分杏泥三錢姜半夏三錢款冬錢半石膏三錢乾薑三分炙甘草一錢消風透痧湯方姜蠶三錢淡豆豉三錢苦杏泥三錢蟬蛻錢半前胡錢半薄荷一錢菊花二錢甘草八分栝蔞皮錢半
