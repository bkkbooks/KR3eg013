body:
  text: 凡例五運六氣天地之氣化也傷寒傳經人身之氣化也各注家不解虛字是以多誤是書於太陽篇中悟出人身冬令之氣化於陽明篇中悟出人身春夏秋三時之氣化此乃醫聖心傳之要學者若能於人身氣化中求病理思過半矣溫病者天氣為病也風自南方來天氣大溫民即病溫溫邪傷經當按經施治病不解則化為熱病人之氣化為病也傷寒化熱伏氣為溫皆人之氣化為病也分經施治治法本同其有不同者傷寒救陽溫病救陰此乃秋冬人氣收藏春夏人氣外泄之故耳拙著有傷寒問答現已脫稿擬集資付刊有願出資者函致天津大費家衚衕合濟醫院可也瘟疫者地氣為病也天以陽生陰長地以陽殺陰藏故地氣傷人天氣不降則地氣上升如冬令無雪民病瘟疫其氣由地下發生鼠先受病即名鼠疫其氣由口鼻入脾胃故傳染法當攻下化熱以後人氣為病治法與熱病同西醫不言氣化以傳染病為瘟疫不知天氣為病亦能傳染如風熱咳嗽其氣由鼻入肺病氣相傳西人誤以為肺疫名之曰百斯篤不知風能生蟲乃氣化之常理風去蟲自絕風不去則久咳成癆此非地氣為病不能殺人其有不愈者誤治之過也肝氣病者人之本氣為病也經云怒則氣上恐則氣下思則氣結驚則氣亂喜則氣緩悲則氣消勞則氣耗氣行血從氣順血調舒其肝氣調其胃氣治法與治天氣為病迥不相同是篇專論溫熱不及雜病故納之於治驗中另立方藥如各種咳嗽五色痢疾等症各附於後學者當求之於治驗中醫聖經文一字包含數十義一語耐人數日思其經義盡在虛字中與無字處各注家不但不解虛字並實字之義亦不加察各逞己見不於原文中求經義而於原文外為之加增字名使後學盲從誤盡蒼生致令傷寒論一書無人敢讀變成荒經是書付氣溫因病本傷寒引以為症略加新解而辨症辨脈諸大法不及備載不能見病知源學者欲明病理當求之於傷寒問答中仲景於傷寒傳經發明人身經氣為病是書於肝氣病中發明人身臟氣為病復於溫疫中發明地氣為病天氣病宜散地氣病宜降人氣病宜和經氣為病辨脈症臟氣為病分營衛學者果能於氣化中求治法則千變萬化庶有準則矣咳嗽肺病也北方風多經云風舍於肺其人則咳此症最忌桑白皮地骨皮吳鞠通亦嘗言之今醫士皆喜用桑白地骨致令病人久咳成癆誤人不淺此乃不求病源專事方藥之過也不知病有陰陽方有寒熱一病有數症一症有數方必先辨症而後定方庶無貽誤是篇於治驗中分列方藥以便研究病情耳痢疾腸胃病也經云腸中熱便腸垢即言此病此病發於春風熱內陷也法當消風此病發於秋暑熱內蘊也法當解暑今醫士每以為腸澼用於術以止痢致痢久不止鄙人嘗見滿人有名連捷者其父在東洋作參贊時患痢常服於術痢至九年而卒此乃前人誤注腸澼為痢之故不知澼字從水腸澼者腸間水瀉也與痢疾適相反水瀉宜止其病在脾脾屬臟臟不宜瀉故用於術以止瀉痢病在腸胃腸胃為腑腑宜通不宜塞若用於術以止痢則移熱於脾腑邪入臟矣是篇於治驗中略言治法以備研究學者當於病理中求方藥幸勿專求方藥而不問病情不辨脈症也溫熱經解六元正紀大論曰辰戌之紀太陽司天氣化運行先天初之氣地氣遷氣乃大溫草木早榮民乃厲溫病乃作其病身熱頭痛嘔吐肌腠瘡瘍卯酉之紀陽明司天氣化運行後天二之氣陽乃布物乃生榮萬大至民善暴死終之氣陽乃布候反溫蟄蟲來見流水不冰民乃康平其病溫寅申之紀少陽司天氣化運行先天初之氣地氣遷風勝乃搖寒乃去候乃大溫草木早榮寒來不殺溫病乃起其病氣怫於上血溢目赤咳逆頭痛血崩脅滿肌腠中瘡三之氣民病熱中聾瞑血溢膿瘡咳嘔鼽衄渴嚏欠喉痹目赤善暴死丑未之紀太陰司天氣化運行後天二之氣大火正物承化民乃和其病溫厲大行遠近咸若濕蒸相搏雨乃時降四之氣畏火臨溽蒸化地氣騰天氣痞隔寒風曉暮蒸熱相搏草木凝煙濕化不流則白露不降以成秋令民病腠理熱血暴溢瘧心腹滿熱臚脹甚則跗腫子午之紀少陰司天氣化遠行先天三之氣天正布大火行庶類蕃鮮寒氣時至民病氣厥心痛寒熱更作咳喘目赤五之氣畏火臨暑反至陽乃化萬物乃生乃長榮民乃康其病溫已亥之紀厥陰司天氣化遠行後天四之氣溽暑濕熱相搏爭於左之上民病黃癉而為跗腫終之氣畏火司令陽乃大化蟄蟲出見流水不冰地氣大發草乃生人乃舒其病溫厲此論客氣溫病也其病皆發於君相二火司令之時其時依年辰固可按圖而索也其為病也不過身熱頭痛耳聾目瞑鼽衄咳喘嘔渴喉痹目赤瘧心腹滿熱臚脹黃癉跗腫血溢血崩肌腠瘡瘍暴死等症而已與後人所論溫病始於上焦由中焦而病及下焦者迥不相同何也病有客氣伏氣之分是經所論客氣溫病也後人所論伏氣溫病也伏氣溫病本冬傷於寒後人論傷寒由表入里溫病自上而下欲撇去傷寒獨開生面以論溫而不自知其無知妄作不但於仲景經文未明經旨並於內難二經所論溫病概不符合此乃無根之學說不足道也仲景論傷寒有寒邪傷經由經傳經者有寒邪傷表由表入里者寒邪入里先入胸為胸滿由心而入心下為心下痞由心下而入腹中為脹滿其病皆自上而下伏氣溫病本冬傷於寒寒邪伏於骨與肩背之膂筋至春病隨氣化由筋骨而出走肌肉化為溫病由肌肉外達皮毛發為熱病伏寒化溫自里出表乃人身之氣隨時變化使然所謂自上而下者乃人之胃氣不能使邪氣外解則邪氣入里由上焦而入中焦甚則深入下焦其病由衛入營由表入里也夫病之所以由表入里自上而下者皆人之氣化使然非病能使然寒邪從毛竅入溫邪亦從毛竅入不得以溫邪為從口鼻入不能從毛竅入也何也人之口鼻呼吸毛竅亦呼吸病氣隨呼吸入人身固無分乎寒與溫也惟瘟疫傳染地氣為病穢濁氣味由口鼻入耳難經五十八難曰溫病之脈不知何經之動也各隨其經之所在而取之此論客氣溫病之脈也傷寒傳經客氣溫病不傳經其病隨君相二火司令之時溫邪傷經而後發發於陽明太陰者為身熱鼽衄渴喘喉痹黃癉跗腫肌膚瘡瘍發於少陽厥陰者為頭痛目赤血溢血崩咳喘脅滿耳聾目瞑嘔逆心痛其病有定時而無定處隨其所傷之經而以針取之難經專論針法未言方藥自仲景發明伊尹湯液辨明經症以合方藥而後人宗之專事方藥不求經旨是以長沙之學未明而軒岐針灸之法漸失真傳矣客氣溫病治法辰戌之紀太陽司天初之氣少陽相火司令溫邪傷人頭痛者桑菊芩連飲主之嘔吐者溫膽湯主之肌腠瘡瘍者荊防敗毒湯主之桑菊芩連飲方桑葉二錢菊花三錢酒芩八分川連八分川芎八分柴胡八分甘草八分溫膽湯方竹茹三錢枳實八分陳皮八分姜夏三錢茯苓三錢甘草一錢荊防敗毒湯方荊芥八分防風八分銀花三錢連翹八分酒芩八分川貝母三錢殭蠶二錢陳皮一錢薄荷八分白芷八分甘草八分天花粉二錢桔梗八分黃連八分痛者加乳香一錢制沒藥一錢制痛甚者加穿山甲一錢炙皂刺一錢炙紹酒一盅煎服卯酉之紀陽明司天二之氣少陽相火司令民善暴死火邪剋金也終之氣少陰君火司令民病溫法當清肅肺金勿使火刑治以辛涼佐以苦甘桑菊二冬之類寅申之紀少陽司天初之氣少陰君火司令溫邪傷人血溢者犀角地黃湯主之三黃湯亦主之目赤者桑菊蟬衣飲主之咳逆頭痛者桑杏湯主之咳逆吐血胸中隱痛脈數大者肺癰也犀黃丸主之婦人血崩者芩連瀉青湯主之不止者與蓮房飲血崩過多氣虛下陷者黃耆建中湯主之胸滿者梔子豉湯主之三之氣少陽相火復司令火邪傷人耳聾目瞑者龍膽瀉肝湯主之血溢者三黃湯主之咳嘔者肝火衛肺犯胃也溫膽湯主之鼽者清肺飲主之衄者先與四生丸不愈與承氣湯喉痹者先與清瘟敗毒湯不愈復與除瘟化毒湯舌上無苔者養陰清火湯主之犀角地黃湯方犀角尖一錢生地二兩芍藥三錢丹皮錢半三黃湯方大黃三錢酒芩半錢川連半錢桑菊蟬衣飲方桑葉一錢菊花一錢蟬退八分赤芍一錢防風六分草決明一錢柴胡六分川芎六分車前子五分包煎青葙子一錢痛者加川連八分起星翳者加木賊草一錢痛甚加龍膽草一錢桑杏湯方桑葉二錢前胡錢半川連一錢川貝母二錢去心杏泥三錢菊花錢半枳殼八分痰中帶血去桑葉加青黛八分童便一杯沖犀黃丸方麝香一分犀黃二錢制乳香一兩制沒藥一兩上四味研細飯糊為丸每服一錢飯後服甘桔湯送下甘桔湯方甘草錢半桔梗錢半芩連瀉青湯方酒芩錢半川連二錢生地一兩阿膠三錢青皮七分白芍三錢甘草一錢蓮房飲方蓮房炭二枚阿膠三錢棉花子炭十四粒黃耆建中湯方黃耆六錢芍藥二錢阿膠三錢飴糖五錢炙甘草一錢龍膽瀉肝湯方龍膽草錢半酒芩一錢澤瀉一錢生地六錢北柴胡三分車前子一錢青皮七分黑山梔一錢甘草一錢清肺飲方酒芩一錢天冬二錢甘草八分川貝母一錢菊花二錢黑山梔一錢麥冬二錢桑葉一錢四生丸方生地六錢生艾葉一錢鮮荷葉二錢生側柏葉三錢上四味研末蜜丸每服一錢承氣湯方酒軍三錢川樸一錢枳實八分甘草八分清溫敗毒湯方葛根二錢蟬蛻一錢酒芩一錢甘草一錢殭蠶二錢木通一錢桑葉二錢川貝母三錢黑山梔錢半山豆根二錢青果三枚打碎除瘟化毒湯方治舌苔黃膩咽喉生蛾腫痛葛根二錢蟬蛻一錢酒芩一錢大力子二錢殭蠶二錢馬勃錢半木通一錢銀花三錢連翹二錢石膏一兩貝母三錢人中黃五分土茯苓三錢龍膽草一錢養陰清火湯方治舌上無苔者陰虛火旺也生地六錢元參四錢麥冬三錢薄荷一錢咽喉腫者加馬勃錢半竹茹二錢丑未之紀太陰司天二之氣少陰君火司令濕蒸熱搏法當清解四之氣少陽相火司令民病腠理熱血暴溢三黃湯主之暴濕化瘧但熱不寒者青蒿滑石湯主之心腹滿熱臚脹宜三黃湯跗腫者宜防己茯苓湯青蒿滑石湯方青蒿三錢滑石三錢川樸一錢建曲二錢扁豆衣錢半銀花露五錢沖甘草一錢知母二錢杏泥二錢酒芩八分通草八分荷葉邊一圈但頭汗出身無汗者加豆豉三錢蔥頭一枚防己茯苓湯木防己一錢茯苓一錢澤瀉一錢甘草八分蒼朮八分滑石二錢酒黃柏八分豬苓一錢子午之紀少陰司天三之氣少陰君火司令寒氣時至民病厥心痛寒熱更作者梔子豆豉湯主之咳喘者杏樸芩連湯主之喘咳氣逆面赤者瀉白散主之五之氣少陽相火司令其病溫法當清解梔子豆豉湯治風寒入胸胸中痞塞煩滿者黑山梔錢半淡豆豉三錢氣虛者加甘草錢半嘔者加生薑三片杏樸芩連湯方杏泥三錢川樸一錢酒芩八分川連一錢陳皮一錢蘇子八分炒川貝二錢甘草一錢瀉白散方桑皮一錢地骨皮二錢甘草一錢粳米一撮巳亥之紀厥陰司天四之氣少陰君火司令民病黃癉茵陳蒿湯主之不愈宜豬膏發煎終之氣少陽相火司令其病溫厲視其病之所在而清之或以針取之茵陳蒿湯方茵陳蒿六錢酒軍二錢黑山梔錢半豬膏發煎方豬板油八兩頭髮如雞子大三圍上二味同煎至頭髮已成灰無渣頓服陰陽應象大論曰冬傷於寒春必病溫春傷於風夏為飧泄夏傷於暑秋為痎瘧秋傷於濕冬生咳嗽此論伏氣為病也伏氣者正邪也冬以寒為正邪春以風為正邪夏以暑為正邪長夏新秋以濕為正邪正邪能伏虛邪實邪微邪賊邪皆不能伏也六氣傷人合於四時只論風寒暑濕而不及燥火何也以燥火二氣不能伏故燥為秋之正邪而置之不論喻嘉言未明經旨為補秋燥一條不知燥傷肺金其病即發為燥咳不能伏至冬令而後咳嗽也謹按燥氣有二有火燥有寒燥火燥傷人其氣不能伏寒燥傷人結為癥瘕為疝氣日久不愈亦伏氣病也嘉言欲補秋燥一條當言疝瘕不當言咳嗽也金匱真言論曰夫精者身之本也故藏於精者春不病溫此論溫病由於傷陰陰精不足陽氣不能潛藏故冬不藏精春必病溫藏精者陰精常足陽精得以潛藏也陽精為人身之本人身有陽氣則生無陽氣則死冬令陰精常足陽氣內藏不為寒傷至春則生氣外發皮膚壯實肌肉堅強雖有客氣邪風勿能害也故藏於精者春不病溫由此觀之溫病之源皆由於冬不藏精陽氣不藏陰精先已虧損治溫病者慎勿誤汗誤下以傷陰則治法明矣熱病論篇曰凡病傷寒而成溫者先夏至日者為病溫後夏至日者為病暑暑當與汗皆出勿止此論伏氣溫病發於春至夏至日止夏至後地氣外發草木皆榮枝葉流膏天氣熱至則暑病生焉凡病傷寒而成溫者或為溫病或為熱病皆先夏至日發也經云重陰必陽重陽必陰故冬傷於寒春必病溫溫盛為熱則病熱不能病暑暑者客氣病也上熱下濕發而為暑人受之則病暑故曰後夏至日者為病暑暑邪傷人病由表入當從表解故曰暑當與汗皆出勿止謹按伏寒發於春至夏至日止伏暑發於秋至冬至日止論病診尺篇曰尺膚熱甚脈盛燥者病溫也其脈盛而滑者病且出也此論伏氣溫病寒已化熱也熱極傷絡故尺膚熱熱甚者其熱甚於他處也脈盛燥者脈大且數也伏氣溫病發於春其邪由筋骨出走肌肉則化熱故脈數由肌肉外達皮膚則衛氣盛而脈浮滑故曰其脈盛而滑者病且出也謹按溫病外達則病當解不解即為熱病矣平人氣象論曰人一呼脈三動一吸脈三動而躁尺熱曰病溫尺不熱脈滑曰病風尺澀曰痹此論伏氣溫病與風溫不同也平人脈一呼當再動一吸亦當再動為平一呼三動一吸三動者數也數則為熱其脈躁其人身必熱數又為虛其脈不躁其人身微熱或竟無熱此虛極之候也診脈須調尺膚尺膚熱而脈躁甚故知其為伏氣溫病也若尺膚不熱而脈滑數者風從火化為風溫也其人當發熱汗出尺膚澀邪傷血絡也血絡不通故痹有寒痹有風痹有濕痹有血痹脈痹骨痹皮痹肉痹考之內經自知謹按身無熱脈滑而尺膚澀者為風痹九宮八風篇云風從北方來者名曰大剛風其傷人也內舍於腎外在於骨與肩背之膂筋其氣主為寒也此論冬傷於寒寒邪所伏之處也冬令寒邪傷表為太陽病寒邪入里為少陰病其病皆即發不能伏至春令而後發也惟冬令北風傷人其人經氣不虛邪不入經而入於骨與肩背之膂筋至春變為溫病矣人之營衛氣日行於陽夜行於陰周行於臟腑經絡而不入骨與肩背之膂筋故寒邪伏焉至春地氣上騰人氣外發寒邪隨氣化外出於肉陽明主肉燥土勝寒故寒邪出走至肉變為溫病此為伏氣春溫也刺熱篇曰太陽之脈色榮顴骨熱病也榮未交曰今且得汗待時而已與厥陰脈爭見者死期不過三日其熱病內連腎少陽之脈色榮頰前熱病也榮未交曰今且得汗待時而已與少陰脈爭見者死期不過三日此論熱病本冬傷於寒寒邪內舍於腎外在於骨與肩背之膂筋為兩感熱病也寒已化熱故脈洪大經云太陽之脈洪大以長脈既洪大色復榮於顴骨此溫邪已化熱出表為熱病故曰熱病也熱病不從外解則由衛入營病名陰陽交榮未交者熱邪在衛衛病不與營俱病其邪當從汗解但太陽病欲解時從巳至未上若至其時不得汗則病不已今且勿傷其陰保其津使之得汗以待時則病當已故曰今且得汗待時而已此熱病之治法也厥陰脈至沉短以緊太陽脈與厥陰脈爭見者浮部洪大而沉部短緊此兩感熱病也傷寒兩感六日死熱病兩感三日死故曰死期不過三日脈沉緊為寒邪內舍於腎故曰其熱病內連腎少陽脈至乍數乍疏乍短乍長脈象如此色復榮於頰前亦熱病也其邪在衛不在營當斷之曰可汗而已但少陽病欲解時從寅至辰上若至其時不得汗則病不已當預保其津使之得汗以待時故曰今且得汗待時而已少陰脈至緊細而微少陽脈與少陰脈爭見者乍數乍疏乍短乍長而又緊細而微也此腎陽已被寒傷病由兩感故死期不過三日謹按唐王冰注將脈色二字連讀是以費解吳鞠通王孟英所引經文悉本王注而不知其誤此軒岐之學所以迄未發明也評熱病論帝曰有病溫者汗出輒復熱而脈躁疾不為汗衰狂言不能食病名為何岐伯對曰病名陰陽交交者死也人之所以汗出者皆生於穀穀生於精今邪氣交爭於骨肉而得汗者是邪卻而精勝也精勝則當能食而不復熱復熱者邪氣也汗者精氣也今汗出而輒復熱者邪氣勝也不能食者精無俾也病而留者其壽可立而傾也且夫熱論曰汗出而脈尚躁盛者死今脈不與汗相應此不勝其病也其死明矣狂言者是失志失志者死今見三死不見一生雖愈必死也此論伏氣溫病汗出而不愈者為熱病也溫病發於陽明其邪由衛入營溫邪在衛脈當浮滑入營則躁汗出而脈躁疾是病不為汗衰也狂言者邪氣入營營氣通心邪熱入心是以狂言也衛為陽營為陰營衛俱病故名陰陽交津汗生於衛液汗生於營營生於穀穀氣者胃氣也有胃氣則生故曰穀生於精伏氣溫病由筋骨出走肌肉其邪氣與穀氣交爭於骨肉得汗而解者邪氣卻精氣勝胃氣未傷也胃氣未傷則當能食而不復熱復熱者邪已入營是邪氣勝也不能食者胃氣已傷胃中無氣營氣無所施其伎故曰精無俾也病之所以愈者營衛氣復也今營衛俱傷但憑病氣以生存其壽能不立傾耶汗出而脈躁盛者其死一不能食者胃中無氣其死二狂言者是失志其死三故曰今見三死不見一生雖愈必死也謹按熱病有六其一為傷寒邪傳陽明為熱病其時當冬令人氣內藏邪氣隨人氣入里為胃家實承氣湯症也其二為冬傷於寒至春人氣外發寒邪化溫溫邪化熱其病由里出表白虎湯症也其有汗出不解脈躁盛而狂言者其邪由衛入營氣血兩燔病名陰陽交宜白虎湯加犀角元參生地若病者能食即有生機又有汗出後胃中燥實不能食者此裡氣不通表邪不得外解也宜先與調胃承氣湯其三為冬令風溫其四為春令風溫其五為夏至後人受暑熱金匱云太陽中暍者熱是也其症汗出惡寒身熱而渴也暑傷氣汗出表氣虛故惡寒熱傷津胃中津竭故身熱而渴白虎加人參湯症也其六為夏傷於暑至秋復感風邪發為熱病其症腹滿身重難以轉側口不仁而面垢譫語遺尿發汗則譫語下之則額上生汗手足逆冷若自汗出者伏暑外發也白虎湯主之其有汗不出出不徹者當轉瘧而愈經云夏傷於暑秋為痎瘧是也玉版要論曰病溫虛甚死此通論溫病由於冬不藏精陰精不足陽氣不能潛藏是以至春病溫也其病發於陽明先傷衛後傷營邪未入營可汗而已營虛者邪必入營營中有氣有血邪初入營營氣未虛者猶可用銀翹等藥引邪出衛若營氣已虛則營血受傷非大劑增液不可迨至營血枯槁陰虛已竭正不勝邪則死故曰病溫虛甚死熱病篇曰熱病三日而氣口靜人迎躁者取之諸陽五十九刺以瀉其熱而出其汗實其陰以補其不足者身熱甚陰陽皆靜者勿刺也其可刺者急取之不汗出則泄所謂勿刺者有死證也此論傷寒傳經化為熱病也關前一分左為人迎右為氣口傷寒發於太陽由表入里診在人迎溫病發於陽明由衛入營診在氣口冬令傷寒化熱邪未入里故氣口靜而人迎躁也病發三日邪在三陽當刺三陽故曰取之諸陽五十九刺以瀉其熱而出其汗經氣不足邪氣始入今邪未入陰當先補其陰故曰實其陰以補其不足者此論傷寒傳經三日傳至少陽寒已化熱為熱病也身熱甚陰陽皆靜者陽氣外越而里無陽故勿刺也此病屬少陰其可刺者邪在三陽不急取之則邪必入陰故曰急取之或汗出而已或泄而已故曰不汗出則泄所謂勿刺者邪已深入少陰真陽外越而里無陽故曰有死證也熱病七日八日脈口動喘而短者急刺之汗且自出淺刺手大指間此論傷寒再傳為熱病也七日邪傳太陽八日再傳陽明其邪由里還表故脈口動喘邪氣甚正氣虛故動喘而短當急刺之以寫其邪汗且自出者邪從外解也手大指間謂少商魚際各二穴熱病七日八日脈微小病者溲血口中乾一日半而死脈代者一日死此論寒邪再傳太陽陽明經期已周邪不出表病已入里化熱為圊血也脈微小衛陽已傷口中乾津液復竭故知一日半而死脈代者經氣已絕其死更速故曰一日死熱病已得汗出而脈尚躁喘且復熱勿刺膚喘甚者死此論病在陽明邪已化熱入里為胃家實當急下之以存陰也傷寒溫病皆當從汗解已得汗出熱當解而不解故脈尚躁陽明內實則腹滿而喘有潮熱故喘且復熱當急下之裡氣不通表邪不得外解此病不在表故曰勿刺膚喘甚者熱傷肺金肺之化源欲絕也故死熱病七日八日脈不躁躁不散數後三日中有汗三日不汗四日死未曾汗者勿腠刺之此論傷寒再傳太陽陽明邪已化熱為熱病也脈不躁邪不在陰也躁不散數邪熱入陰而陰猶未傷故後三日中當有汗三日不汗者陰傷不得汗出也四日合八日為十二日傳經之期已盡營衛不行五臟不通邪不得出故死未曾汗出者邪已入陰也邪在陽可以腠刺邪已入陰故曰勿腠刺之熱病不知所痛耳聾不能自收口乾陽熱甚陰頗有寒者熱在髓死不可治此論溫病兩感邪伏少陰化熱為熱病也邪入骨髓故不知所痛耳聾有虛有實邪在少陽耳聾者表邪外閉也邪在厥陰耳聾者肝火內盛也邪在少陰耳聾者腎虛精脫也不能自收者衛陽欲亡也口乾陰液欲竭也陽熱甚陰頗有寒者邪熱在表真陰內竭真陽外越而里無陽是以陰頗有寒也陽盛陰竭則骨髓熱邪入骨髓故死不可治熱病已得汗而脈尚躁盛此陰脈之極也死其得汗而脈靜者生此論伏氣溫病溫邪化燥為熱病當即下之以存陰也伏氣溫病發於陽明陽明內實裡氣不通表邪不得外解故已得汗而脈尚躁盛此陽明陽盛陰竭不下則死故曰此陰脈之極也死其得汗而脈靜者裡氣得通表邪已從外解也故生熱病脈尚盛躁而不得汗者此陽脈之極也死脈盛躁得汗靜者生此論伏氣溫病邪已入營為熱病當養陰以救陽也邪已入營故脈盛躁邪熱傷陰故不得汗此陽盛陰竭法當養陰增液以救陽非針法所能治故曰此陽脈之極也死其得汗而脈靜者正勝邪卻陰液未傷營衛自和也故生熱病不可刺者有九一曰汗不出大顴發赤噦者死二曰泄而腹滿甚者死三曰目不明熱不已者死四曰老人嬰兒衄而腹滿者死五曰汗不出嘔下血者死六曰舌本爛熱不已者死七曰咳而衄汗不出出不至足者死八曰髓熱者死九曰熱而痙者死腰折瘈瘲齒噤齘也凡此九者不可刺也此論熱病傷陰非針法所能治故不可刺者有九也汗者津液也熱邪在衛必汗解不汗出邪已入營矣顴主骨熱邪傷陰陰竭則熱邪入骨故大顴發赤噦者裡氣不通也陰津已竭而裡氣復不通熱邪不從外解矣故死泄者津液下滲也泄則腹中空不當滿腹滿者陰津已竭邪熱入里也邪熱內結裡氣不通營衛不行故死目得血而能視目不明邪熱入營陰已傷也營血傷而熱猶不已則陰精竭矣故死老人津液已枯嬰兒津液未足熱病傷陰本非所宜其腹未滿則邪熱在陽尚可取之諸陽以瀉其熱實其陰以補其不足至熱而腹滿邪已入里補之不能瀉之不可故曰死汗不出表邪未解不當嘔下嘔下血者邪熱入營血熱妄行正不勝邪也故死脾病在舌本腎脈夾舌本舌本爛邪熱入陰經血已傷熱仍不已故死咳里病也邪在氣分而咳者可以外解邪在血分而咳者不能外解矣衄熱極傷絡也血去熱清咳當止咳而衄者血已傷而熱不已邪氣勝也汗不出出不至足者邪熱不從外解也故死髓者人之陰精也津液未傷髓不能熱髓熱者津液俱傷邪熱深入骨髓也故死痙津液病也津液不足以養筋則痙熱邪傷陰津液枯槁故痙而死也腰折者角弓反張太陽症也瘈瘲者抽搐不寧厥陰症也齒噤齘陽明痙也凡此九者邪熱傷陰法當滋陰非針法所能治故曰不可刺也傷寒雜病論曰太陽病發熱而渴不惡寒者為溫病若發汗已身灼熱者名曰風溫此論溫病有冬傷於寒至春變為溫病者有冬令風傷陽明發為風溫者皆溫病也不可不辨論何以稱太陽病太陽者寒水之氣也天之太陽寒水氣來自北方為北風地之太陽寒水為終之氣主冬人之太陽寒水經氣主表冬令北風傷人之表其寒氣伏於骨與肩背之膂筋至春地氣上騰人氣外發寒變為溫其病本冬傷於寒故稱太陽病渴陽明裡症也身熱不惡寒陽明外症也伏氣溫病發於陽明故發熱而渴不惡寒此傷寒伏氣變為溫病也冬令有溫病風熱外傷陽明也何以稱太陽病以地之太陽主冬病發於冬故稱太陽病太陽中風當以桂枝湯發太陽之汗汗出風解身熱即退若風傷陽明以桂枝湯發太陽之汗則汗出不解身反灼熱矣何也冬令人氣內藏津液在裡桂枝本為解肌不能發汗故以桂枝湯發太陽之汗不但汗出已身反灼熱矣此病與中風不同與伏氣溫病又不同故名曰風溫謹按是篇文法極精後人不知研究是以誤解節中若字各注家均直承上文溫病而言故誤解風溫為溫病之變症不思仲景何以不曰發汗已身灼熱為風溫而必加以若字者字復加名曰等字耶若字之義當從外撇撇去伏氣溫病而後言客氣風溫也不惡寒者身灼熱者兩者字對較一為溫病一曰傷寒所以辨症也伏氣溫病本冬傷於寒不必另立名故篇中論伏氣溫病皆曰傷寒冬令風溫與傷寒同時發病而見症大不相同必須另立其名與傷寒對待故前論傷寒曰名曰傷寒此論風溫曰名曰風溫後人不察不明經旨但求方藥猶欲別開生面以論溫病脈症不辨死生莫決此吾國醫學所以愈趨愈下也辨太陽病脈症篇曰傷寒無大熱口燥渴心煩背微惡寒者白虎加人參湯主之此論伏氣溫病在裡化熱也寒邪在表當發熱惡寒何以無大熱以冬傷於寒至春變為溫病也伏氣溫病本冬傷於寒故曰傷寒寒邪化溫由里出表溫邪在裡故表無大熱溫病發於陽明陽明經氣化燥燥氣化火胃中干故口燥渴胃絡通心胃中干津液不足以養心燥火入心故心煩寒邪化溫其邪伏於骨與肩背之膂筋由膂筋出走肌肉化為溫病其病在肩背膂筋之間者尚未化溫故背微惡寒白虎湯為陽明溫病之主方辛涼解肌其寒不入膂筋口燥渴心煩為陽明溫邪化熱熱傷陽明津液之見症法當清熱救陰故曰背微惡寒者白虎加人參湯主之白虎加人參湯方知母六錢石膏一兩六錢碎綿裹炙甘草二錢粳米一合人參二錢或用黨參或用西洋參均可米熟湯成傷寒脈浮滑此表有熱里有寒白虎湯主之此論伏氣溫病邪已出衛化熱為熱病也冬令傷寒寒邪在表脈當浮緊寒邪在表化熱脈當浮數邪傳陽明化熱脈當數急不能浮滑也惟冬傷於寒至春變為溫病其邪由筋骨出衛衛氣盛則脈浮滑故曰脈浮滑少陰傷寒表無熱此非少陰傷寒寒邪已化熱出表故曰表有熱太陽傷寒里無寒此非太陽傷寒寒邪伏於筋骨之裡故曰里有寒白虎湯解肌肉間氣分之熱其氣不入筋骨故主之謹按此節經義在此字有字中仲景文法有正面有對面有反面此字對面為彼字有字反面為無字仲景論傷寒病有太陽傷寒有少陰傷寒有伏氣溫病伏氣溫病伏於骨與肩背之膂筋此非太陽經亦非少陰經彼少陰傷寒表無熱此表有熱彼太陽傷寒里無寒此里有寒各注家不於此字有字中求精義不明經旨是以不知伏氣溫病伏於何處並不知少陰傷寒與太陽傷寒之脈症如何妄加議論以表熱裡寒之症與白虎湯不合將寒字改作痰字以誤後學不思仲景何以不言表熱裡寒本論云表熱裡寒四逆湯主之毫釐千里在有字中注仲景書而不論字義妄改經文此長沙之學所以迄未發明也白虎湯方石膏一兩六錢碎綿裹知母六錢甘草二錢粳米一合傷寒病若吐若下後七八日不解熱結在裡表裡俱熱時時惡風大渴舌上乾燥而煩欲飲水數升者白虎加人參湯主之此論伏氣溫病已化熱也伏氣溫病本冬傷於寒故稱傷寒復由溫病化為熱病故曰傷寒病冬令傷寒人氣內藏若吐若下後則衛氣內傷寒邪必內陷於胃溫病發於春人氣外發故邪不內陷傷寒七八日當傳經溫病不傳經故不解溫病化熱結於陽明肌肉之裡由里出表故表裡俱熱中風惡風邪在太陽為表實溫病惡風邪在陽明為表虛中風風邪在太陽經穴汗不出即翕翕惡風溫病無風邪吐下傷氣衛氣虛故時時惡風大渴胃中干也舌上乾燥而煩欲飲水數升者溫邪傷津吐下復傷津邪已化熱也白虎解陽明之熱加人參以補氣生津故主之風溫為病脈陰陽俱浮自汗出身重多眠睡息必鼾語言難出若被下者小便不利直視失溲若被火者微發黃色劇則如驚癇時瘈瘲若火熏之一逆尚引日再逆促命期此論冬令風溫之脈症也冬令風邪在表脈當浮陰陽者手之太陰足之趺陽兩部之脈也風溫傷衛肺主衛故太陰脈浮風溫傷陽明趺陽診陽明故趺陽脈浮各注家均以尺寸解陰陽不思仲景自序何以言握手不及足仲景嘗言寸口關上尺中此何以不言尺寸而言陰陽耶難經云溫病之脈不知何經之動也當隨其經之所在而取之風溫病在陽明不當診之趺陽乎自汗出風邪傷陽明經氣化燥也身重風邪在肌也多眠睡風熱入脾也脾熱則嗜臥故多眠睡冬令人氣內藏風邪開腠理入肌肉隨人之氣化入里故有諸症呼出心與肺吸入肝與腎呼吸之間脾受穀氣也風溫之邪在肌肉睡則隨人之氣化入脾出肺而上衝於鼻故吸必鼾會厭者聲音之門戶風溫之邪由脾肺上升則會厭受邪故誤言不便聲音難出也風邪在表不可下被下者被醫誤下之人也仲景論風溫誤下何以言被下之人不曰若下之而曰若被下者以宗族之誤於醫也仲景因漢時醫家不知冬令有風溫不可以治傷寒之法治之其宗族多被醫誤故曰被下者者字對面有未被下者若被下者若字之義從外撇撇去上文發汗言未發汗而被下者也冬令風溫被下人氣內藏風熱隨氣化內陷則水氣不化故小便不利風熱入里內動肝風故直視溲稀糞也小便不利津液即還入胃中故失溲溫邪在表不可灸被火者被醫誤灸之人也少陰傷寒有火灸之法風溫不可灸若被火者言未被下而被火又一誤治也火氣有微甚風火相搏風邪在肌肉火氣雖微即發黃色於皮膚肌色本黃黃自里出故曰發火氣甚則病劇火邪隨風氣入里傷肝及筋內動肝氣故如驚癇風火傷筋故時瘈瘲若邪未入里則皮膚被火黃色轉黑似火熏之矣風溫為病當解外不解外而下之為逆風溫為病當清解不清解而以火灸之亦為逆一逆則病期延長再逆則命期短促故曰一逆尚引日再逆促命期謹按風溫為病內難二經均未論及惟仲景論之最詳無如仲景之文一字包含數十義一語耐人數日思後學識淺每無研究之資格是以王叔和誤解於前各注家誤解於後以訛傳訛致令醫聖心傳湮沒二千有年不知誤人多少陽明病脈浮而緊咽燥口苦腹滿而喘發熱汗出不惡寒反惡熱身重若發汗則躁心憒憒反譫語若加燒針必怵惕煩躁不得眠若下之則胃中空虛客氣動膈心中懊憹舌上苔者宜梔子豉湯主之此論春令風溫也風邪入肌肉陽明主肌肉故稱陽明病春令風氣通肝風令脈浮肝脈弦緊者弦之甚也春令肝旺復感風邪故脈浮而緊口苦咽乾少陽見症也燥者干之甚風溫化燥故咽燥風溫化火故口苦風邪入肝肝火乘脾當腹滿不當喘而喘陽明溫病也春令津液外泄風邪傷津則胃中燥實故腹滿胃熱上衝肺故腹滿而喘發熱汗出風溫見症也不惡寒反惡熱陽明外症也風溫與傷寒相反故曰反惡熱身重風邪在肌也春令人氣在頭津液外泄不可發汗若誤以溫散之藥發其汗汗傷津液則躁心中無津液則神昏故憒憒胃中無津液則燥屎內結故譫語心神欲去亦譫語今心神未去不當譫語而譫語故曰反譫語此燥屎譫語也少陰傷寒當燒針陽明溫病不當燒針若加燒針於少陰經上則火氣通心風邪入心必怵惕風火傷少陰心陽不得下交於腎腎陰不能上濟君火故煩躁不得眠也風邪在表未入胃不當下若下之則胃中空虛人氣外發風邪不入胃而內動於膈風邪者客氣也故曰客氣動膈膈間有水氣風溫之邪在膈中則水氣生熱上熏於心故心中懊憹外邪不解汗不外泄水氣上蒸則舌上生苔故曰舌上苔者者字對面為舌上無苔者若舌上無苔邪已入營不宜梔豉舌上苔者風邪在衛外未解也此非梔子豉湯症宜服梔子豉湯故曰宜梔子豉湯主之若渴欲飲水口乾舌燥者白虎加人參湯主之此論春令風溫邪已化熱熱結在陽明肌肉中也若字之義從外撇撇去上文咽燥口苦而言咽燥口苦陽明症兼少陽也少陽症未罷風熱在裡不可與白虎湯若風溫化熱邪在肌肉汗出傷津津欲竭而熱不解則渴欲飲水風熱在外少陽症不見則口不苦而口乾咽不燥而舌燥此津已傷而熱結在肌當用白虎以解肌加人參以生津若脈浮發熱渴欲飲水小便不利者豬苓湯主之此論春令風溫熱水內蘊裡氣不通溫邪不得外解也用若字撇去上文脈浮而緊言脈但浮而不緊撇去汗出而言發熱撇去口乾舌燥而言小便不利者此風邪在外故脈浮外不解故發熱水氣不化故渴欲飲水小便不利也此為熱水內蘊溫邪不得外解當用豬苓湯分利之水氣化則腑氣通人氣外泄汗自出而溫邪外解矣豬苓湯方豬苓茯苓澤瀉滑石阿膠各錢半陽明病汗出多而渴者不可與豬苓湯以汗多胃中燥豬苓湯複利其小便故也此論夏令風溫內夾暑澀故汗出多也汗出水氣化汗出多則小便少不可因渴欲飲水而與豬苓湯夏令人氣外發風邪在陽明化熱故汗多而渴汗多傷津胃中燥風熱外泄不下行小便必少此非熱水內蘊故不可以豬苓湯複利其小便也陽明病其人多汗以津液外出胃中燥大便必硬硬則譫語小承氣湯主之若一服譫語止更莫復服此論夏令風溫人氣外泄故多汗若溫邪輕而未化熱則汗不多其人汗多者風溫已化熱也汗出於胃熱盛傷津則胃中燥實大便必硬胃絡通心大便硬則胃中燥熱之氣入心故譫語此腑氣不通溫邪不得外解當以小承氣湯通其腑腑氣一通邪氣即從外泄不宜過服故曰若一服譫語止更莫復服小承氣湯方大黃二錢炙枳實八分炙厚朴一錢汗出譫語者以有燥屎在胃中此為風也須下之過經乃可下之下之若早語言必亂以表虛里實故也下之則愈宜大承氣湯此論風溫之所以汗出譫語者以有燥屎在胃中不在腸中也腸中有燥屎雖十日不更衣無所苦也胃中有燥屎必譫語胃中何以有燥屎以胃為燥土風溫復化燥津液外出胃中燥實即有燥屎此為風溫化熱故曰此為風也燥屎當下風溫之邪未入里不當下若溫邪化熱熱入心胞法當清營非下法所能愈惟不大便六七日邪已過經而汗出譫語此為燥屎譫語當下之故曰須下之過經乃可下之下之若早則風邪內陷秋冬人氣收藏風邪內陷為協熱利春夏人氣外泄風邪內陷為熱入心胞故語言必亂不當下惟裡氣不通表邪不得外解者當下之下之後表邪入里為表虛里實當審察其邪在心胞在胃中若邪已入胃期已過經當復下之宜大承氣湯此風溫再下之法也大承氣湯方大黃四錢酒洗厚朴八錢炙枳實錢半炙芒硝二錢三陽合病腹滿身重難以轉側口不仁而面垢譫語遺尿發汗則譫語下之則額上生汗手足逆冷若自汗出者白虎湯主之此論秋令風溫人氣內收暑邪內伏也三陽同受風邪風與風合故謂之合病腹滿病在陽明身重病在太陽難以轉側病在少陽故曰三陽合病秋令風涼人氣內收邪氣入里故腹滿暑熱內蘊外感風邪汗不得出故身重風傷衛衛氣不行於周身故難以轉側風傷營營氣不通則口不仁營氣不營於面風邪復化燥則面垢風邪外束暑熱內蘊暑氣通心靜則多言故譫語譫語者夢語也夢語不醒故遺尿此病當汗解不曰若發汗而曰發汗則譫語何也以風邪當從外解而不可以麻桂發其汗燥金當令暑熱在裡胃中尤易化燥故發汗則譫語此燥屎譫語也不曰若下之而曰下之則額上生汗手足逆冷何也以風邪在表症見腹滿裡氣不通表邪不得外解法當下而又不可以大下風氣上行邪在陽明陽明經上額下之則風氣逆經額上生汗此非脫汗乃陽明經氣被風熱上逆而生汗也故不曰額汗出而曰額上生汗秋令人氣內收下之則衛氣不達於四肢故手足逆冷此非少陰寒厥乃風熱入里人氣內收經氣不得外達是以手足逆冷也若秋令風溫未經汗下而自汗出者伏暑外發溫已化熱熱在陽明肌肉之中白虎湯症也故曰白虎湯主之脈浮發熱口乾能食者必發衄此論風溫傷經時當秋令人氣內收風邪化燥燥傷經絡也風令脈浮故脈浮熱在陽明經中脈亦浮本論云脈但浮者必盜汗出又曰脈雖浮數者可下之皆論陽明經中有熱也溫邪化熱故發熱熱在陽明經中故口乾陽明中風能食中寒不能食能食者風邪入經也陽明風溫陽氣盛能食者穀氣多胃陽復盛穀氣入營則陽氣重故必衄也可與承氣湯論云不大便六七日頭痛有熱者與承氣湯又曰頭痛者必衄此陽明之裡有熱也故與承氣湯陽明病發熱汗多者急下之宜大承氣湯此論秋令溫邪入里已化熱也溫邪在陽明故稱陽明病傷寒化熱入陽明之裡則潮熱譫語其汗不多溫邪入陽明之裡則發熱汗多溫邪傷陰當急下之以存陰故曰發熱汗多者急下之宜大承氣湯發汗不解腹滿痛者急下之宜大承氣湯此承上文論溫病也溫邪傷陰不可發汗故發汗不解腹滿痛者邪已入里燥結也不下則陰竭故曰急下之宜大承氣湯腹滿不減減不足言當下之宜大承氣湯此承上文論溫病已下不愈當再下之也上文言腹滿痛此但言腹滿不減而不言痛則病已減矣然腹滿不減方藥不能減雖痛已減去而腹滿未除不足言減故曰當下之宜大承氣湯大下後六七日不大便煩不解腹滿痛者此乃燥屎也所以然者本有宿食故也宜大承氣湯此論溫病大下後宿食未去裡氣不通溫邪不得外解也冬令人氣內藏大下後寒邪入里下傷衛陽則下利不止春令人氣外泄大下後溫邪不入里下傷津液故煩熱不解傷寒煩熱表未解也溫病煩熱里不通也六七日飲食漸進津液已回當大便煩當解不大便煩不解而腹滿痛者此本有宿食裡氣不通溫邪不得外解也必有燥屎在腹中故曰腹滿痛者此有燥屎也何以知之以煩不解故知之大下後裡氣得通溫邪當從臭汗出不當煩所以煩者以有宿食未去裡氣未通也故曰所以然者本有宿食故也宜大承氣湯不宜小承氣湯生氣通天論曰因於暑汗煩則喘喝靜則多言體若燔炭汗出而散此論暑溫化為熱病也人之衛陽因受暑熱暑熱之氣內通於心煩則其氣上越故喘喝靜則其氣入心故多言暑邪化熱熱甚傷津故體若燔炭其邪由表入當從表出故汗出而散此治暑之法所謂暑當與汗皆出勿止也刺志篇曰氣盛身寒得之傷寒氣虛身熱得之傷暑此論夏令傷寒傷暑之別也寒傷形暑傷氣夏令傷寒毛竅閉塞汗不得出故氣盛身寒若冬令傷寒寒傷衛陽則體痛嘔逆不能氣盛寒邪在表當發熱惡寒不能身寒也暑邪傷氣故氣虛其邪由太陽入陽明故身熱謹按前人注此但言寒暑之辨而不知寒與寒尚有辨冬令傷寒與夏令傷寒見症不同治法各異可不辨哉金匱云太陽中暍者熱是也汗出惡寒身熱而渴白虎加人參湯主之此論夏令傷暑為熱病也天氣熱曰暍熱邪傷人由表入里故曰太陽中暍此夏令傷熱也熱傷氣表氣虛故汗出惡寒其熱在肌肉陽明所主熱傷陽明陽明經氣化燥故身熱而渴白虎解肌肉之熱加人參以生津故主之太陽中暍身熱疼重而脈微弱此以夏月傷冷水水行皮中所致也一物瓜蒂湯主之此論夏月先中暍後傷冷水也熱由太陽入陽明故身熱復傷冷水水行皮中則營衛俱滯營氣被阻則身疼衛氣被阻則身重太陽中暍脈當數大不當微弱而脈微弱何也此以冷水在皮中隨營衛氣行營衛氣被阻不能達於脈致令脈微弱故曰此以夏月傷冷水水行皮中所致也瓜蒂苦寒能吐能下去身面四肢水氣水氣去則熱解故主之一物瓜蒂湯方瓜蒂二七個上銼以水一升煮取五合去渣頓服太陽中暍發熱惡寒身重而疼痛其脈弦細芤遲小便已洒洒然毛聳手足逆冷小有勞身即熱口開前板齒燥若發其汗則惡寒甚加溫針則發熱甚數下之則淋甚此承上文而言也太陽中暍當汗出惡寒身熱而渴不當發熱惡寒身重而疼痛發熱惡寒者冷水在皮中也衛氣被阻故身重營氣被阻故身痛寒痛曰痛熱痛曰疼傷暍復傷水故疼痛太陽中暍脈當數大今脈弦弦則衛氣不行衛氣傷故脈弦營氣傷故脈細芤遲營衛傷暍復傷水故脈弦細芤遲膀胱為太陽之府太陽之氣從寒化寒氣下行則小便太陽之氣外達毫毛小便已太陽之氣還行於皮毛皮中有水氣故洒洒然毛聳冷水在皮中營衛氣被阻其氣不達於四肢故手足逆冷小有勞則熱氣外泄故身即熱熱氣從口出故口開口開則氣與津俱出其津不及前板齒故前板齒燥宜瓜蒂湯前已言之矣冷水在皮中發之不得出若發汗則太陽之氣與皮中之水氣合故惡寒甚暍中太陽加溫針則熱益盛故發熱甚下之則熱邪下注數下之則所中之暍悉入下焦下焦熱則淋閉不通故淋甚謹按前人解此不承上文是以費解濕家之為病一身盡疼發熱身色如熏黃也此論濕溫之邪在肌中化熱則發黃梔子柏皮湯症也濕熱在外鬱於肌中則生熱營氣被阻故一身盡疼疼者痠痛也此為熱痛非寒痛也濕熱鬱於肌中不得汗故發熱肌色本黃濕熱不得從外解則發黃但黃無汗故曰身色如熏黃也濕家其人但頭汗出背強欲得被覆向火若下之太早則噦或胸滿小便不利舌上如苔者以丹田有熱胸上有寒渴欲得飲而不能飲則口燥煩也此論濕溫由寒濕化熱濕熱可下寒濕不可下也濕之為病其類不一有寒有熱有表有里概而言之故曰濕家但頭汗出者濕熱上升也表氣不通濕熱內蘊不得解故其人但頭汗出而身無汗也濕熱不攘大筋軟短小筋弛長故背強濕為陰邪濕邪在表未化熱故欲得被覆向火不曰不可下而曰下之太早者非不可下須俟寒濕化熱而後下之也寒濕在表尚未化熱下之則寒濕入胃胃受寒即噦若寒濕入胸胸中之氣不行則胸滿表氣不通裡氣不得運則小便不利豈非下之太早乎濕邪在表舌上本無苔舌上如苔者言舌上如有苔也下後濕邪入里水氣上騰則舌上生苔水氣在胸中必丹田有熱熱氣上蒸而後化生舌苔也故曰舌上如苔者以丹田有熱胸上有寒丹田有熱上升入胃則渴欲飲水胸上有寒水氣不化欲飲而不能飲則口燥心煩此寒濕在裡化熱也陽明病發熱汗出此為熱越不能發黃也但頭汗出而身無汗劑頸而還小便不利渴引水漿者此為瘀熱在裡身必發黃茵陳蒿湯主之此論濕熱不得汗解小便復不利則瘀熱在裡必發黃也溫病發於陽明故曰陽明病陽明溫病在春夏當發熱汗出邪從汗解不能發黃此非秋令濕溫故曰此為熱越不能發黃也秋令天氣清肅人氣內收暑熱內蘊清涼外加汗不易得故但頭汗出而身無汗劑頸而還若里無水氣則小便自利里無熱則不渴頭汗亦不出小便不利渴引水漿者濕熱內蘊渴欲得飲而不能飲也此濕熱瘀在陽明之裡故曰此為瘀熱在裡濕鬱熱瘀必發黃茵陳蒿湯治濕熱在裡之黃故主之金匱云溫瘧者其脈如平身無寒但熱骨節煩疼時嘔白虎加桂枝湯主之此論寒邪伏於骨節不發溫病而發溫瘧也冬令寒邪入骨節不在膂筋故至春不發溫病至夏邪在骨節發熱故煩疼其氣外舍於分肉之間內通於心以夏令人氣在胸故病發於骨節而邪氣聚於胸其氣不達於脈故其脈如平寒在骨節已化熱故身無寒但熱也經云心熱病者善嘔熱聚於胸則胸中煩熱故時嘔此非少陽症之喜嘔不可與小柴胡湯其病以時發其邪舍於分肉間為太陰陽明兩經所主之處故以白虎清陽明之邪加桂枝以解太陰之邪謹按溫瘧發於初夏夏令人氣在胸瘧發則其氣入胸當先其時服白虎加桂枝湯一劑知二劑已後人所擬五汁飲竹葉石膏湯皆不可用何也此症最忌麥冬若誤用麥冬引邪入心病即加劇發病時邪熱入心強者煩擾不堪徹夜不寐弱者危矣白皮加桂枝湯方即白虎湯中加桂枝三錢伏氣溫病身溫無汗口微渴心不煩舌上苔薄者銀花竹葉湯主之銀花竹葉湯銀花三錢竹葉二錢豆豉三錢薄荷一錢杏泥三錢桔梗錢半甘草八分葦根三錢伏氣溫病尺膚熱寒已化熱為熱病身熱心煩汗出脈洪大者白虎湯主之伏氣溫病溫邪入胸心中懊憹舌上胎者梔子豉湯主之伏氣溫病溫邪入心下心下痞硬者小陷胸湯主之小陷胸湯方川連一錢半夏三錢栝蔞實三錢伏氣溫病化熱身熱汗出不大便三四日舌苔黃燥者與承氣湯伏氣溫病化熱誤發汗口燥渴心煩熱不已者白虎加人參湯主之伏氣溫病化熱十餘日熱不甚夜間發熱熱退無汗者青蒿鱉甲湯主之青蒿鱉甲湯方青蒿二錢鱉甲五錢生地四錢知母二錢丹皮三錢伏氣溫病已化熱身熱不退舌苔色赤口不渴者邪已入營清營湯主之清營湯方銀花三錢麥冬三錢生地五錢犀角二錢竹葉心一錢連翹二錢元參三錢丹參二錢川連二錢半春令人氣外發風從東南來其風溫人受之即病溫名曰風溫其人發熱汗出不惡寒反惡熱身重宜銀翹散加減汗出熱不退邪已化熱身不重脈洪大者宜白虎湯春令風溫肝火旺風氣通肝口苦咽乾脈弦者桑菊飲主之桑菊飲方桑葉二錢菊花一錢連翹錢半薄荷錢半甘草八分杏泥二錢酒芩一錢葦根二錢春令風溫咳嗽咽痛身癢舌上起紅刺如楊梅刺欲作風痧桑杏消風湯主之此症名爛喉丹痧不可治喉痧出喉自愈若誤用犀角羚羊芩連等藥則痧毒內攻入里即死若用溫散之品痧出後耳下腫大為痧毒必膿出而後愈也症頗危險西醫誤以為猩紅熱用冰冰之即死桑杏消風湯方桑葉二錢薄荷一錢杏泥三錢前胡錢半殭蠶三錢蟬蛻錢半甘草八分春令風溫風邪入胸心中懊憹者梔子豉湯主之春令風溫渴欲飲水小便不利者豬苓湯主之春令風溫化熱內動肝風痙厥者羚羊角湯主之羚羊角湯方羚羊角一錢薄荷一錢杏泥二錢竹茹三錢桑葉錢半甘草一錢杭菊花三錢小兒傷風內動肝火猝然痙厥者名急驚風羚羊竹瀝薄荷鉤藤湯主之羚羊竹瀝薄荷鉤藤湯方羚羊角八分竹瀝水一兩加薑汁十滴沖薄荷一錢鉤藤二錢春令風溫咳嗽脅痛者桑杏羚羊湯主之咳血者咳血湯主之桑杏羚羊湯方桑葉二錢川貝母二錢前